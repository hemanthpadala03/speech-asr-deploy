name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Unit tests
        # No API keys in CI -- these are the mocked unit tests only, real
        # network calls are opt-in locally via scripts/run_prompt_eval.sh.
        run: pytest tests/ -q
